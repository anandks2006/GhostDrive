[tool.poetry]
name = "ghostdrive"
version = "0.1.0-alpha"
description = "GhostDrive - Encrypted, redundant, multi-backend personal cloud drive"
authors = ["Anand K S <anand@ghostdrive>"]
readme = "README.md"
license = "AGPL-3.0"
packages = [{ include = "ghostdrive" }]

[tool.poetry.scripts]
ghostdrive     = "ghostdrive.web.server:main"
ghostdrive-cli = "ghostdrive.cli.ghostdrive_cli:main"
ghostdrive-web = "ghostdrive.web.server:main"
ghostdrive-restore = "ghostdrive.cli.recovery_tool:main"
ghostdrive-tray   = "ghostdrive.platform.tray:run_tray"

# ─── Core dependencies (Month 1–4) ───────────────────────────────────────────
[tool.poetry.dependencies]
python        = "^3.11"
cryptography  = "^42.0"          # ChaCha20-Poly1305, AES-256-GCM, HKDF-SHA512
argon2-cffi   = "^23.1"          # Argon2id, once per session
mnemonic      = "^0.21"          # BIP39 24-word seed phrases
blake3        = "^0.4"           # BLAKE3 dedup hash (pre-compression, pinned)
aiofiles      = "^23.2"          # Non-blocking file I/O for generator pipeline
keyring       = "^25.2"          # OS keyring (libsecret/DPAPI/Keychain)
zstandard     = "^0.22"          # zstd level 3 (fixed constant, never user-configurable)
httpx         = { version = "^0.27", extras = ["socks"] }  # All backends, SOCKS5, streaming
sqlcipher3    = "^0.6"           # Encrypted SQLite database layer
psutil        = "^5.9"           # Process & system drive monitoring for polling fallback

# ─── Backend dependencies (Month 3–4) ────────────────────────────────────────
[tool.poetry.group.backends.dependencies]
Telethon         = "^1.36"       # Telegram MTProto, flood wait, session expiry detection
discord-py       = "^2.3"        # Discord bot channel backend
aiohttp          = "^3.9"        # Discord CDN streaming
paramiko         = "^3.4"        # SFTP for NAS
smbprotocol      = "^1.13"       # SMB/CIFS for NAS
zeroconf         = "^0.131"      # mDNS for NAS discovery

# ─── Web Application dependencies ─────────────────────────────────────────────
[tool.poetry.group.web.dependencies]
fastapi          = "^0.110"      # Web framework API layer
uvicorn          = { version = "^0.29", extras = ["standard"] } # ASGI server
websockets       = "^12.0"       # Real-time WebSocket streaming
python-multipart = "^0.0.9"      # Form-data and file upload support

# ─── Phase 2 dependencies (Month 7+) ─────────────────────────────────────────
[tool.poetry.group.phase2.dependencies]
zfec = "^1.5"                    # Reed-Solomon erasure coding (4+2 shards)
# liboqs-python handled separately: requires liboqs C library (see docs/setup_liboqs.md)

# ─── System tray (optional) ────────────────────────────────────────────────
[tool.poetry.group.tray.dependencies]
pystray = "^0.19"       # Cross-platform system tray icon (Windows/macOS/Linux)
Pillow  = "^10.3"       # Tray icon rasterization

# ─── Development / Testing ───────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest            = "^8.2"
pytest-asyncio    = "^0.23"
hypothesis        = "^6.100"
pytest-cov        = "^5.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "integration: live network tests requiring real credentials (deselect with -m 'not integration')",
]

[tool.coverage.run]
source  = ["ghostdrive"]
omit    = ["ghostdrive/web/static/*", "ghostdrive/cli/*", "ghostdrive/backends/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 85
