[tool.poetry]
name = "ghostdrive"
version = "0.1.0-alpha"
description = "GhostDrive - Encrypted, redundant, multi-backend personal cloud drive"
authors = ["Anand K S <anand@ghostdrive>"]
readme = "README.md"
license = "AGPL-3.0"
packages = [{ include = "ghostdrive" }]

[tool.poetry.scripts]
ghostdrive     = "ghostdrive.main:main"
ghostdrive-cli = "ghostdrive.cli.ghostdrive_cli:main"

# ─── Core dependencies (Month 1–4) ───────────────────────────────────────────
[tool.poetry.dependencies]
python        = "^3.11"
cryptography  = "^42.0"          # ChaCha20-Poly1305, AES-256-GCM, HKDF-SHA512
argon2-cffi   = "^23.1"          # Argon2id, once per session
mnemonic      = "^0.21"          # BIP39 24-word seed phrases
blake3        = "^0.4"           # BLAKE3 dedup hash (pre-compression, pinned)
aiofiles      = "^23.2"          # Non-blocking file I/O for generator pipeline
keyring       = "^25.2"          # OS keyring (libsecret/DPAPI/Keychain)
zstandard     = "^0.22"          # zstd level 3 (fixed constant, never user-configurable)
httpx         = { version = "^0.27", extras = ["socks"] }  # All backends, SOCKS5, streaming

# ─── Backend dependencies (Month 3–4) ────────────────────────────────────────
[tool.poetry.group.backends.dependencies]
Telethon         = "^1.36"       # Telegram MTProto, flood wait, session expiry detection
boto3            = "^1.34"       # S3-compatible: Backblaze B2, Cloudflare R2, Storj
huggingface-hub  = "^0.23"       # Git LFS, ml_artifacts_only flag
internetarchive  = "^3.3"        # Archive.org – DISPOSABLE tier only
ipfs-api         = "^0.2"        # IPFS CIDv1, pin verification via pinning service API
mega-py3         = "^1.0"        # Mega.nz (primary); MEGAcmd subprocess fallback

# ─── GUI dependencies (Month 6) ───────────────────────────────────────────────
[tool.poetry.group.gui.dependencies]
PyQt6     = "^6.6"               # Desktop GUI framework
qasync    = "^0.27"              # asyncio event loop integration with Qt
Pillow    = "^10.3"              # Image thumbnails
pymupdf   = "^1.24"              # PDF first-page preview

# ─── Phase 2 dependencies (Month 7+) ─────────────────────────────────────────
[tool.poetry.group.phase2.dependencies]
zfec = "^1.5"                    # Reed-Solomon erasure coding (4+2 shards)
# liboqs-python handled separately: requires liboqs C library (see docs/setup_liboqs.md)

# ─── Development / Testing ───────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
pytest            = "^8.2"
pytest-asyncio    = "^0.23"
hypothesis        = "^6.100"
pytest-cov        = "^5.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source  = ["ghostdrive"]
omit    = ["ghostdrive/gui/*", "ghostdrive/cli/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 85
